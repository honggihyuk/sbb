<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="css">
    <style>
        .fieldError { color: #b02a37; }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">

    <!-- 도서 정보 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between">
            <h5 class="mb-0" th:text="${book.title}">제목</h5>
            <span th:text="|조회수 ${book.viewCount}|"></span>
        </div>
        <div class="card-body">
            <p>저자 : <span th:text="${book.author}"></span></p>
            <p>등록일 : <span th:text="${#temporals.format(book.created, 'yyyy-MM-dd HH:mm')}"></span></p>
            <hr>
            <p style="white-space: pre-line;" th:text="${book.content}">소개</p>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/book/list}" class="btn btn-sm btn-secondary">목록</a>
            <a th:href="@{|/book/modify/${book.id}|}" class="btn btn-sm btn-outline-primary">수정</a>
            <form th:action="@{|/book/delete/${book.id}|}" method="post" class="d-inline"
                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
            </form>
        </div>
    </div>

    <!-- 리뷰 목록 -->
    <h5 class="mb-3">
        리뷰 <span class="badge bg-primary" th:text="${#lists.size(book.reviewList)}">0</span>
        <small class="text-muted" th:if="${!#lists.isEmpty(book.reviewList)}"
               th:text="|평균 ${#numbers.formatDecimal(#aggregates.avg(book.reviewList.![rating]), 1, 1)}점|"></small>
    </h5>

    <div th:if="${#lists.isEmpty(book.reviewList)}" class="alert alert-light border text-muted">
        아직 등록된 리뷰가 없습니다.
    </div>

    <div th:each="review, loop : ${book.reviewList}" class="card mb-2">
        <div class="card-body d-flex justify-content-between align-items-start">
            <div>
                <span class="text-warning" th:text="${#strings.repeat('★', review.rating)}"></span>
                <p class="mb-1" style="white-space: pre-line;" th:text="${review.content}"></p>
                <small class="text-muted" th:text="${#temporals.format(review.created, 'yyyy-MM-dd HH:mm')}"></small>
            </div>
            <form th:action="@{|/review/delete/${review.id}|}" method="post"
                  onsubmit="return confirm('리뷰를 삭제할까요?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
            </form>
        </div>
    </div>

    <!-- 리뷰 작성 -->
    <div class="card shadow-sm mt-4">
        <div class="card-header bg-light"><h5 class="mb-0">리뷰 작성</h5></div>
        <div class="card-body">
            <form th:action="@{|/review/create/${book.id}|}" th:object="${reviewDto}" method="post">
                <div class="mb-3">
                    <label for="rating" class="form-label">평점</label>
                    <select th:field="*{rating}" class="form-select">
                        <option value="">-- 선택 --</option>
                        <option th:each="n : ${#numbers.sequence(5, 1)}" th:value="${n}" th:text="|${n}점|"></option>
                    </select>
                    <p th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="fieldError"></p>
                </div>
                <div class="mb-3">
                    <textarea th:field="*{content}" class="form-control" rows="4"
                              placeholder="리뷰를 입력하세요."></textarea>
                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError"></p>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">리뷰 등록</button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
