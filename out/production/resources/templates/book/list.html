<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<div layout:fragment="content" class="container my-3">

    <h2 class="mb-4 fw-bold">도서 목록</h2>

    <!-- 검색창 + 등록 버튼 -->
    <div class="row mb-3">
        <div class="col-6">
            <a th:href="@{/book/create}" class="btn btn-primary">도서 등록</a>
        </div>
        <div class="col-6">
            <div class="input-group">
                <input type="text" id="search_kw" class="form-control"
                       th:value="${kw}" placeholder="제목 또는 저자 검색">
                <button class="btn btn-outline-secondary" type="button" id="btn_search">검색</button>
            </div>
        </div>
    </div>

    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr class="text-center">
            <th style="width: 80px;">번호</th>
            <th>제목</th>
            <th>저자</th>
            <th>평점</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book, loop : ${paging}" class="text-center">
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td class="text-start">
                <a th:href="@{|/book/${book.id}|}" th:text="${book.title}"
                   class="text-decoration-none text-dark fw-semibold"></a>
                <span th:if="${#lists.size(book.reviewList) > 0}"
                      th:text="${#lists.size(book.reviewList)}"
                      class="badge bg-primary rounded-pill"></span>
            </td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.rating}"></td>
            <td th:text="${#temporals.format(book.created, 'yyyy-MM-dd')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(paging)}">
            <td colspan="7" class="text-center text-muted py-5">등록된 도서가 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 -->
    <div th:if="${!paging.isEmpty()}">
        <th:block th:with="startPage=${(paging.number/10) * 10},
            endPage=(${(paging.totalPages == 0) ? 1 : (startPage + 9 < paging.totalPages ? startPage + 9 : paging.totalPages - 1)})">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${paging.number == 0} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)" th:data-page="0">처음</a>
                </li>
                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)" th:data-page="${paging.number-1}">이전</a>
                </li>
                <li th:each="page : ${#numbers.sequence(startPage, endPage)}"
                    th:classappend="${page == paging.number} ? 'active'" class="page-item">
                    <a th:text="${page + 1}" class="page-link" href="javascript:void(0)" th:data-page="${page}"></a>
                </li>
                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)" th:data-page="${paging.number+1}">다음</a>
                </li>
                <li class="page-item" th:classappend="${paging.number == paging.totalPages-1} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)" th:data-page="${paging.totalPages-1}">마지막</a>
                </li>
            </ul>
        </th:block>
    </div>

    <!-- 페이지 이동/검색용 숨은 폼 -->
    <form th:action="@{/book/list}" method="get" id="searchForm">
        <input type="hidden" id="kw" name="kw" th:value="${kw}">
        <input type="hidden" id="page" name="page" th:value="${paging.number}">
    </form>
</div>

<script layout:fragment="script" type="text/javascript">
    // 페이지 번호 클릭
    Array.from(document.getElementsByClassName("page-link")).forEach(function (element) {
        element.addEventListener('click', function () {
            document.getElementById('page').value = this.dataset.page;
            document.getElementById('searchForm').submit();
        });
    });

    // 검색 버튼 클릭
    document.getElementById("btn_search").addEventListener('click', function () {
        document.getElementById('kw').value = document.getElementById('search_kw').value;
        document.getElementById('page').value = 0;     // 검색하면 첫 페이지부터
        document.getElementById('searchForm').submit();
    });
</script>
</html>
